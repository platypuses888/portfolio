<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="save30.css"><title>Save30 — трекер спринта</title></head><body><main class="w" id="app"></main>
<script src="save30.js"></script><script>
const TASKS=['Проверьте подписки на кино и музыку','Приготовьте обед дома','Откажитесь от одной доставки','Отмените ненужную подписку','Возьмите кофе из дома','Сравните цену перед покупкой','Пройдитесь пешком вместо такси','Отложите покупку на 24 часа','Просмотрите траты за неделю','Найдите бесплатную замену платному сервису'];
let pz=null,tm=null,log=[];const app=$('#app');
const total=()=>Object.keys(S.done).length*350+(S.p||0);
function go(){S.name=($('#nm').value.trim()||'гость').slice(0,24);save();render()}
function tg(d){S.done[d]?delete S.done[d]:S.done[d]=1;S.saved=total();save();render()}
function pzUI(){const e=$('#pz');if(!e)return;if(!pz){e.innerHTML='';return}
e.innerHTML=pz.left>0?'<div class="msg">Пауза: '+pz.left+' с (в жизни — 24 часа). «'+pz.it+'» за '+fmt(pz.pr)+': это нужно или просто захотелось?</div>':'<div class="msg ok">Пауза прошла. Что решаете?</div><div class="row" style="margin-top:10px"><button class="btn" onclick="dec(1)">Отложить и сохранить '+fmt(pz.pr)+'</button><button class="btn o" onclick="dec(0)">Всё равно куплю</button></div>'}
function st(){const it=$('#it').value.trim(),pr=+$('#pr').value;if(!it||!(pr>0)){$('#pz').innerHTML='<div class="msg">Укажите, что хотите купить, и цену.</div>';return}
clearInterval(tm);pz={it,pr,left:10};pzUI();tm=setInterval(()=>{pz.left--;if(pz.left<=0)clearInterval(tm);pzUI()},1000)}
function dec(s){if(s)S.p+=pz.pr;log.unshift((s?'Отложено: ':'Куплено: ')+pz.it+' · '+fmt(pz.pr));pz=null;S.saved=total();save();render()}
function render(){if(!S.name){app.innerHTML='<p class="k">Вход</p><h1>Как вас зовут?</h1><div class="box" style="max-width:420px"><label for="nm">Имя</label><input id="nm" maxlength="24"><p class="mu" style="font-size:13px;margin:10px 0">Имя хранится только в вашем браузере, пароль не нужен.</p><button class="btn" onclick="go()">Начать спринт</button></div>';return}
const n=Object.keys(S.done).length;let nx=1;while(S.done[nx]&&nx<30)nx++;
app.innerHTML='<p class="k">Спринт · '+S.name+'</p><h1>День '+(n>=30?30:nx)+' из 30</h1><div class="grid"><div class="box"><p class="k" style="margin:0">Отложено</p><p class="big g">'+fmt(total())+'</p><div class="bar" style="margin-top:10px"><i style="width:'+n/30*100+'%"></i></div><p class="mu" style="font-size:13px;margin-top:6px">Выполнено дней: '+n+' из 30</p></div>'+
'<div class="box"><p class="k" style="margin:0">Задание дня</p><h3 style="margin-top:8px">'+(n>=30?'Спринт пройден':TASKS[(nx-1)%10])+'</h3>'+(n>=30?'':'<button class="btn" onclick="tg('+nx+')">Выполнено · +350 ₽</button>')+'</div></div>'+
'<h2>30 дней</h2><div class="cells">'+Array.from({length:30},(_,i)=>'<button class="cell '+(S.done[i+1]?'d':'')+'" onclick="tg('+(i+1)+')">'+(i+1)+'</button>').join('')+'</div>'+
'<h2>Пауза на импульс</h2><div class="box"><div class="grid"><div><label for="it">Что хочется купить</label><input id="it" placeholder="Например, кроссовки"></div><div><label for="pr">Цена, ₽</label><input id="pr" type="number" min="1" placeholder="5990"></div></div><div style="margin-top:14px"><button class="btn" onclick="st()">Хочу купить</button></div><div id="pz"></div>'+
(log.length?'<hr class="rule">'+log.slice(0,5).map(l=>'<p class="mono" style="font-size:14px">'+l+'</p>').join(''):'')+'</div>';pzUI()}
S.saved=total();render();</script></body></html>
