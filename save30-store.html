<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="save30.css"><title>Save30 — магазин</title></head><body><main class="w">
<p class="k tx">Магазин</p><h1 class="tx">Покупка сверяется с бюджетом</h1>
<div class="shop"><div class="tiles" id="cat"></div>
<aside class="side c rv"><label for="bd" style="margin-top:0">Свободный бюджет, ₽</label><input id="bd" type="number" min="0"><div class="bar" style="margin:14px 0 6px"><i id="bb"></i></div><p class="mu" style="font-size:13px">Осталось <b id="lf" style="color:var(--ink)"></b></p>
<p class="k">Корзина</p><div id="cart"></div><div class="li" style="font-weight:800"><span>Итого</span><span id="tt"></span></div><button class="btn" id="buy" style="margin-top:12px">Оформить</button><div id="note"></div>
<p class="k">Отложено на 30 дней</p><div id="wl" class="mu" style="font-size:14px">Пока пусто.</div></aside></div></main>
<script src="save30.js"></script><script>
const I=[['Беспроводные наушники',7490,'Звук','#c9ff3b','50%'],['Кроссовки беговые',5990,'Спорт','#f2f5ee','14px'],['Городской рюкзак',3490,'Сумки','#ff6a4d','50% 50% 12px 12px'],['Ручная кофемолка',2190,'Кухня','#ffd166','8px 50%'],['Настольная лампа',2790,'Дом','#7bdcb5','50% 8px'],['Книга по инвестициям',890,'Книги','#c9ff3b','4px'],['Термокружка',1190,'Кухня','#f2f5ee','50%'],['Умные часы',12990,'Гаджеты','#ff6a4d','50% 50% 0 0']];
const K='#0a0d0b',W='#f2f5ee';
const G=[
'<path d="M20 58V50a30 30 0 0 1 60 0v8" fill="none" stroke="'+K+'" stroke-width="7" stroke-linecap="round"/><rect x="12" y="54" width="18" height="30" rx="9" fill="'+K+'"/><rect x="70" y="54" width="18" height="30" rx="9" fill="'+K+'"/><rect x="17" y="62" width="8" height="14" rx="4" fill="'+W+'"/><rect x="75" y="62" width="8" height="14" rx="4" fill="'+W+'"/>',
'<path d="M10 74V62C22 60 28 54 30 42L40 46C44 54 52 56 64 58C78 60 88 66 90 74Z" fill="'+K+'"/><rect x="10" y="72" width="80" height="9" rx="4.5" fill="#ff6a4d"/><path d="M42 50l6-6M50 54l6-6M58 57l6-6" stroke="'+W+'" stroke-width="3" stroke-linecap="round"/>',
'<path d="M40 30v-6a10 10 0 0 1 20 0v6" fill="none" stroke="'+K+'" stroke-width="6"/><rect x="24" y="30" width="52" height="56" rx="18" fill="'+K+'"/><rect x="34" y="42" width="32" height="5" rx="2.5" fill="'+W+'"/><rect x="34" y="58" width="32" height="20" rx="8" fill="'+W+'"/>',
'<path d="M50 34V20h22" fill="none" stroke="'+K+'" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="74" cy="20" r="6" fill="'+K+'"/><rect x="30" y="34" width="40" height="8" rx="4" fill="'+K+'"/><path d="M32 42h36l-6 40H38z" fill="'+K+'"/><rect x="42" y="54" width="16" height="14" rx="4" fill="'+W+'"/>',
'<path d="M41 80L52 46L68 30" fill="none" stroke="'+K+'" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="80" width="34" height="7" rx="3.5" fill="'+K+'"/><path d="M58 22l24 14-10 14-26-12z" fill="'+K+'"/><circle cx="78" cy="68" r="10" fill="'+W+'"/>',
'<rect x="18" y="24" width="31" height="58" rx="4" fill="'+K+'"/><rect x="52" y="24" width="31" height="58" rx="4" fill="'+K+'"/><path d="M26 38h15M26 46h15M26 54h10M60 38h15M60 46h15M60 54h10" stroke="'+W+'" stroke-width="3" stroke-linecap="round"/>',
'<rect x="38" y="12" width="24" height="14" rx="5" fill="'+K+'"/><rect x="34" y="22" width="32" height="64" rx="10" fill="'+K+'"/><rect x="34" y="46" width="32" height="14" fill="#ff6a4d"/>',
'<rect x="38" y="8" width="24" height="84" rx="8" fill="'+K+'"/><rect x="26" y="28" width="48" height="44" rx="14" fill="'+K+'"/><rect x="31" y="33" width="38" height="34" rx="10" fill="'+W+'"/><path d="M50 41v10l7 5" stroke="'+K+'" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'];
let cart=[],wl=[],last=-1;const sm=()=>cart.reduce((a,i)=>a+I[i][1],0),bd=$('#bd');bd.value=S.budget;
$('#cat').innerHTML=I.map((t,i)=>'<div class="c it rv" id="t'+i+'"><div class="ph" style="background:'+t[3]+'"><svg viewBox="0 0 100 100" width="108" height="108" aria-hidden="true">'+G[i]+'</svg></div><h3 style="font-size:19px">'+t[0]+'</h3><p class="mu" style="font-size:13px">'+t[2]+'</p><div class="row" style="justify-content:space-between;margin-top:12px"><b>'+fmt(t[1])+'</b><button class="btn" data-i="'+i+'"></button></div></div>').join('');
$('#cat').onclick=e=>{let i=e.target.dataset.i;if(i==null)return;i=+i;const p=I[i][1];
if(sm()+p>S.budget){const t=$('#t'+i);t.classList.remove('shake');void t.offsetWidth;t.classList.add('shake');$('#note').innerHTML='<div class="msg">«'+I[i][0]+'» стоит '+fmt(p)+', а осталось '+fmt(S.budget-sm())+'.<div style="margin-top:8px"><button class="btn o" data-w="'+i+'">Отложить на 30 дней</button></div></div>';return}
cart.push(i);last=cart.length-1;$('#note').innerHTML='';draw()};
$('#note').onclick=e=>{if(e.target.dataset.w!=null){wl.push(+e.target.dataset.w);$('#note').innerHTML='';draw()}};
$('#cart').onclick=e=>{if(e.target.dataset.x!=null){cart.splice(+e.target.dataset.x,1);last=-1;draw()}};
bd.oninput=()=>{S.budget=Math.max(0,+bd.value||0);save();draw()};
$('#buy').onclick=()=>{if(!cart.length)return;S.budget-=sm();bd.value=S.budget;cart=[];save();draw();$('#note').innerHTML='<div class="msg ok">Заказ оформлен. Бюджет обновлён.</div>'};
function draw(){const s=sm(),l=S.budget-s;tw($('#lf'),l);tw($('#tt'),s);$('#bb').style.width=(S.budget?Math.min(100,s/S.budget*100):100)+'%';$('#buy').disabled=!cart.length;
I.forEach((t,i)=>{const b=document.querySelector('#t'+i+' .btn'),ok=s+t[1]<=S.budget;b.textContent=ok?'В корзину':'Не по бюджету';b.className='btn'+(ok?'':' o')});
$('#cart').innerHTML=cart.length?cart.map((i,k)=>'<div class="li'+(k==last?' flash':'')+'"><span>'+I[i][0]+'</span><span>'+fmt(I[i][1])+' <button class="btn o" style="padding:2px 10px" data-x="'+k+'" aria-label="Убрать">×</button></span></div>').join(''):'<p class="mu" style="font-size:14px">Пусто.</p>';
if(wl.length)$('#wl').innerHTML=wl.map(i=>'<div class="li"><span>'+I[i][0]+'</span><span>'+fmt(I[i][1])+'</span></div>').join('')}
draw();</script></body></html>
