<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="save30.css"><title>Save30 — магазин с проверкой бюджета</title></head><body><main class="w">
<p class="k">Магазин</p><h1>Покупка, которая сверяется с бюджетом.</h1>
<div class="grid"><div class="box"><label for="bd">Свободный бюджет на месяц, ₽</label><input id="bd" type="number" min="0"><p class="mu" style="font-size:13px;margin-top:8px" id="left"></p></div>
<div class="box"><p class="k" style="margin:0">Корзина</p><div id="cart"></div><div id="note"></div></div></div>
<h2>Каталог</h2><div class="grid" id="cat"></div>
<h2>Отложено на 30 дней</h2><div id="wl" class="mu">Пока пусто.</div></main>
<script src="save30.js"></script><script>
const I=[['Беспроводные наушники',7490,'Звук','#e8d9c0'],['Кроссовки беговые',5990,'Спорт','#d7e2d3'],['Городской рюкзак',3490,'Сумки','#e3d4cd'],['Ручная кофемолка',2190,'Кухня','#dfdbc9'],['Настольная лампа',2790,'Дом','#e6dcc2'],['Книга по инвестициям',890,'Книги','#d9d4e0'],['Термокружка',1190,'Кухня','#d3dfe0'],['Умные часы',12990,'Гаджеты','#e4d0d0']];
let cart=[],wl=[];const sm=()=>cart.reduce((a,i)=>a+I[i][1],0),bd=$('#bd');bd.value=S.budget;
bd.oninput=()=>{S.budget=Math.max(0,+bd.value||0);save();draw()};
function add(i){const p=I[i][1];if(sm()+p>S.budget){$('#note').innerHTML='<div class="msg">Не вписывается: «'+I[i][0]+'» стоит '+fmt(p)+', а в бюджете осталось '+fmt(S.budget-sm())+'.<div style="margin-top:8px"><button class="btn o" onclick="lt('+i+')">Отложить на 30 дней</button></div></div>';return}
cart.push(i);$('#note').innerHTML='';draw()}
function lt(i){wl.push(i);$('#note').innerHTML='';draw()}
function rm(k){cart.splice(k,1);draw()}
function buy(){S.budget-=sm();bd.value=S.budget;cart=[];save();draw();$('#note').innerHTML='<div class="msg ok">Заказ оформлен. Бюджет обновлён.</div>'}
function draw(){$('#left').textContent='После корзины останется '+fmt(S.budget-sm());
$('#cart').innerHTML=cart.length?cart.map((i,k)=>'<div class="li"><span>'+I[i][0]+'</span><span class="mono">'+fmt(I[i][1])+' <button class="btn o" style="padding:2px 8px" onclick="rm('+k+')" aria-label="Убрать">×</button></span></div>').join('')+'<div class="li"><b>Итого</b><b class="mono">'+fmt(sm())+'</b></div><button class="btn" onclick="buy()">Оформить</button>':'<p class="mu">Пусто.</p>';
$('#cat').innerHTML=I.map((t,i)=>'<div class="box"><div class="ph" style="background:'+t[3]+'">'+t[2]+'</div><h3>'+t[0]+'</h3><p class="mono" style="margin-bottom:12px">'+fmt(t[1])+'</p><button class="btn '+(sm()+t[1]>S.budget?'o':'')+'" onclick="add('+i+')">'+(sm()+t[1]>S.budget?'Не по бюджету':'В корзину')+'</button></div>').join('');
if(wl.length)$('#wl').innerHTML=wl.map(i=>'<div class="li"><span>'+I[i][0]+'</span><span class="mono">'+fmt(I[i][1])+'</span></div>').join('')}
draw();</script></body></html>
